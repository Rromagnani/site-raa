name: Atualizar e publicar site

on:
  schedule:
    - cron: "0 9 * * *"    # todo dia às 06h (Brasília)
    - cron: "0 17 * * 1-5" # e às 14h nos dias úteis
  push:
    branches: [main]
  workflow_dispatch:       # botão "Run workflow" para publicar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
